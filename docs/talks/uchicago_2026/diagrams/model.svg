<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker></defs>
<rect width="1920" height="1080" fill="#fcfcfb"/>
<text x="40" y="70" font-size="40" fill="#0b0b0b" font-weight="bold" text-anchor="start">The detector: a panorama in, a heatmap out</text>
<text x="40" y="108" font-size="22" fill="#52514e" font-weight="normal" text-anchor="start">One network, one channel, points rather than boxes. rampnet/model.py, 1 epoch on the auto-labelled dataset, 16 GPUs for 3.5 hours.</text>
<rect x="40" y="170" width="330" height="220" rx="18" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="62" y="218" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start">Equirectangular panorama</text>
<text x="62" y="262" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">3 × 2048 × 4096</text>
<text x="62" y="288" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">whole 360°, resized</text>
<text x="62" y="314" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">ImageNet-normalised</text>
<line x1="374" y1="280" x2="408" y2="280" stroke="#52514e" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="412" y="170" width="330" height="220" rx="18" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="434" y="218" font-size="24" fill="#fcfcfb" font-weight="bold" text-anchor="start">ConvNeXt V2 base</text>
<text x="434" y="262" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">timm fcmae_ft_in22k_in1k_384</text>
<text x="434" y="288" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">features at 1/32:</text>
<text x="434" y="314" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">1024 × 64 × 128</text>
<line x1="746" y1="280" x2="780" y2="280" stroke="#52514e" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="784" y="170" width="330" height="220" rx="18" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="806" y="218" font-size="24" fill="#fcfcfb" font-weight="bold" text-anchor="start">Conv head + bilinear ×16</text>
<text x="806" y="262" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">two 3×3 convs, ReLU</text>
<text x="806" y="288" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">upsample to 1 × 512 × 1024</text>
<text x="806" y="314" font-size="19" fill="#fcfcfb" font-weight="normal" text-anchor="start">MSE loss against the targets</text>
<line x1="1118" y1="280" x2="1152" y2="280" stroke="#52514e" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="1156" y="170" width="330" height="220" rx="18" fill="#cde2fb" stroke="#9ec5f4" stroke-width="1.5"/>
<text x="1178" y="218" font-size="24" fill="#184f95" font-weight="bold" text-anchor="start">Keypoint heatmap</text>
<text x="1178" y="262" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Gaussian bumps, σ = 10 px</text>
<text x="1178" y="288" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">one per curb ramp</text>
<text x="1178" y="314" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">values in [0, 1]</text>
<line x1="1490" y1="280" x2="1524" y2="280" stroke="#52514e" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="1528" y="170" width="330" height="220" rx="18" fill="#f3f2ee" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="1550" y="218" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start">Peaks → detections</text>
<text x="1550" y="262" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">peak_local_max, min distance 10</text>
<text x="1550" y="288" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">threshold 0.55 deployed,</text>
<text x="1550" y="314" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">0.30 recommended</text>
<rect x="40" y="470" width="580" height="300" rx="18" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="64" y="524" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="start">Whole panorama, no tiles</text>
<text x="64" y="570" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">A ramp is a small thing in a big image: 2048 ×</text>
<text x="64" y="599" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">4096 in, 512 × 1024 out, so the network sees</text>
<text x="64" y="628" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">every crossing at once. The seam is handled by</text>
<text x="64" y="657" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">wrapping the scorer, not the image.</text>
<rect x="660" y="470" width="580" height="300" rx="18" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="684" y="524" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="start">Points, not boxes</text>
<text x="684" y="570" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">The training labels are points (a GPS record</text>
<text x="684" y="599" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">projected to a pixel), so the model predicts</text>
<text x="684" y="628" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">points. Matching to ground truth is by distance:</text>
<text x="684" y="657" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">0.022 of the panorama width, about 90 px.</text>
<rect x="1280" y="470" width="580" height="300" rx="18" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="1304" y="524" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="start">The dataset is the result</text>
<text x="1304" y="570" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">A YOLO trained on the same labels is 0.016 F1</text>
<text x="1304" y="599" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">behind at matched operating points. The</text>
<text x="1304" y="628" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">supervision, not the architecture, is what</text>
<text x="1304" y="657" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">separates RampNet from zero-shot models (0.79 vs</text>
<text x="1304" y="686" font-size="21" fill="#52514e" font-weight="normal" text-anchor="start">0.57).</text>
<text x="40" y="1052" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">rampnet/model.py; docs/stage2_training_cost.md; docs/seed_variance_51_135.md; docs/model_scoreboard.md.</text>
</svg>
